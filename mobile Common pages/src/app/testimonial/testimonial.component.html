 -->

<section  id="testimonial_section">
<img src="https://d1zt14hr2k4poi.cloudfront.net/version9.0/images/assets_mobile/images/testimonial/testimonial-banner.jpg"  class="testimonial-banner" alt="testimonial-banner.jpg">
<!-- <h3 class="testimonial_head">Our Happy Clients</h3> -->
    <div class="testimonial_section_main">
        <div class="container">
        <div class="row">
            <div class="col-lg-6 col-md-6 col-sm-12 col-padding" *ngFor="let testimonial of testimonialListing">
                <div class="card">
                    <div class="row">
                    <div class="col-6">
                        <img src="{{testimonialImage}}{{testimonial.testimonial_Img}}"
                        alt="testimonial.testimonial_altag" class="rounded_img">
                    </div>
                    <div class="col-6 square-wrapper">
                        <h4 class="card-title-size">{{testimonial.testimonial_name}}</h4>
                        <p class="designation-text">{{testimonial.designation}}</p>
                        <!-- <p class="designation-text submitted-text">{{testimonial.submitted_date}}</p> -->
                    </div>
                    </div>
                    <div class="card-custom-body">
                    <div class="quote"> <i class="fa fa-quote-left" aria-hidden="true"></i> </div>
                    <p class="card-text">{{testimonial.testimonial_description}}</p>
                     <a href="{{testimonial.testimonial_link}}" target="_blank" class="readmore-btn">Read more</a>
                    </div>
                </div>
            </div>
          </div>
        </div>
    </div>
 </section>
<div>
    <ng-container *ngComponentOutlet="FooterComponent"></ng-container>
</div>
<div class="innerheader_position">
    <app-innerheader></app-innerheader>
</div>
