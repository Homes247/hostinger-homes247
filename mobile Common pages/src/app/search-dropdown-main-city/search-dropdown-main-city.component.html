<div class="search-dropdown" [ngClass]="{'open':shown && list !== undefined}">
    <div class="search-dropdown__btn" (click)="show()">
      <!-- <span>{{value | titlecase}}</span> -->
      <input class="search-dropdown__dropdown__search" type="text" [placeholder]="value" [(ngModel)]="keyword"
      (keyup)="search(keyword)" #input/>
    </div>
    <div class="search-dropdown__dropdown">
      <div class="search-dropdown__dropdown__scroller">
        <div class="search-dropdown__dropdown__item" *ngFor="let item of list" (click)="select(item)">
          {{item[_label] | titlecase}}
        </div>
        <div class="search-dropdown__dropdown__msg" *ngIf="list?.length == 0">
          No Result Found
        </div>
      </div>
    </div>
  </div>
