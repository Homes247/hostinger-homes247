<router-outlet></router-outlet>

@defer (on idle) {

@if (shouldRender) {
<div class="ready-property-popup__backdrop" (click)="closePopup()"></div>

<div class="ready-property-popup" (transitionend)="onSheetTransitionEnd()" role="dialog" aria-modal="true"
    aria-label="Your property is ready to go live">
    <button type="button" class="ready-property-popup__close" (click)="closePopup()" aria-label="Close">
        &times;
    </button>

    <div class="ready-property-popup__image-wrap">
        <img [src]="topImage" alt="Property ready to go live" class="ready-property-popup__image" />
    </div>

    <h2 class="ready-property-popup__title">
        Your Property is Ready to Go Live
    </h2>

    <p class="ready-property-popup__description">
        Great news! Your property has been reviewed and approved by our team.
    </p>

    <div class="ready-property-popup__actions">
        <button type="button" class="ready-property-popup__btn ready-property-popup__btn--primary"
            (click)="completePayment()">
            <span class="ready-property-popup__btn-text">Completed Payment</span>
            <img [src]="completePaymentIcon" alt="" class="ready-property-popup__btn-icon" />
        </button>

        <button type="button" class="ready-property-popup__btn ready-property-popup__btn--secondary">
            <span class="ready-property-popup__btn-text">View Property Details</span>
            <img [src]="rightArrowIcon" alt=""
                class="ready-property-popup__btn-icon ready-property-popup__btn-icon--arrow" />
        </button>
    </div>
</div>
}}
