<div class="search-dropdown" [ngClass]="{'open': shown && list !== undefined}">
  <div class="search-dropdown__btn" (click)="show()">
    <!-- <span>{{value | titlecase}}</span> -->
    <input 
      class="search-dropdown__dropdown__search" 
      type="text" 
      [placeholder]="value" 
      [(ngModel)]="keyword"
      (keyup)="search(keyword)" 
      #input
    />
  </div>

  <div class="search-dropdown__dropdown">
    <div class="search-dropdown__dropdown__scroller">
      
      <!-- Angular 21 @for loop with tracking -->
      @for (item of list; track item[_uid]) {
        <div class="search-dropdown__dropdown__item" (click)="select(item)">
          {{item[_label] | titlecase}}
        </div>
      }

      <!-- Angular 21 @if condition for empty results -->
      @if (list?.length === 0) {
        <div class="search-dropdown__dropdown__msg">
          No Result Found
        </div>
      }

    </div>
  </div>
</div>
